name: Bug report
description: Something navigera did that it should not have, or did not do.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to see it
      description: The commands you ran, in order, and what each printed (`--raw` off, so the JSON shows).
      render: text
      placeholder: navigera -s work goto https://example.com
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What `navigera --version` prints.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04, macOS 15, Windows 11
    validations:
      required: true
