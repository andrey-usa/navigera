name: agent-setup
description: >
  What every agent-eval / agent-check job needs: navigera built from
  this commit, Chrome on $CHROME_BIN and Gemini CLI on $GEMINI_BIN (Linux
  or Windows runners). The other tools are installed by the job itself,
  after onboarding runs (an onboarding agent must find its tool not
  installed).
runs:
  using: composite
  steps:
    - uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        toolchain: stable
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    # `python` on every runner (Windows has no python3 command).
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Build navigera (release)
      shell: bash
      run: |
        cargo build --release --locked --bin navigera
        # setup-rust-toolchain pins the toolchain for this checkout only
        # (rustup override); agent workspaces get the default a developer
        # machine has.
        rustup default stable
    - name: Chrome
      shell: bash
      run: |
        if [ "$RUNNER_OS" = Windows ]; then
          chrome='C:\Program Files\Google\Chrome\Application\chrome.exe'
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          powershell -NoProfile -Command "'Chrome ' + (Get-Item '$chrome').VersionInfo.ProductVersion"
        else
          echo "CHROME_BIN=$(which google-chrome)" >> "$GITHUB_ENV"
          google-chrome --version
        fi
    - name: Gemini CLI
      shell: bash
      run: |
        npm install -g @google/gemini-cli@0.62.0
        if [ "$RUNNER_OS" = Windows ]; then
          # The JS entry point, run with node: the npm .cmd shim goes
          # through cmd.exe, which cuts a multi-line prompt argument.
          entry=$(node -e "const p=require('path'),d=p.join(require('child_process').execSync('npm root -g').toString().trim(),'@google','gemini-cli');b=require(p.join(d,'package.json')).bin;console.log(p.join(d,typeof b==='string'?b:b.gemini))")
          echo "GEMINI_BIN=$entry" >> "$GITHUB_ENV"
          node "$entry" --version
        else
          echo "GEMINI_BIN=$(which gemini)" >> "$GITHUB_ENV"
        fi
