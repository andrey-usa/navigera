name: ci

on:
  # next is where the work lands; master moves at a release.
  push:
    branches: [master, next]
  pull_request:
  workflow_dispatch:
  # Weekly: a new Chrome Stable/Beta release must not break
  # agents before we notice.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

# A newer push to a branch replaces the run of the one before it.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The CLI's default output is the compact form for agents; the steps
  # here read the JSON lines.
  NAVIGERA_OUTPUT: json

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --check

      - name: Tests (unit + browser e2e on the runner's Chrome, CDP traced)
        # About three times what it takes. A process a failed test leaves
        # behind can hold the log open after cargo has ended: on Windows
        # that once kept this step waiting for the job's whole 40 minutes.
        timeout-minutes: 15
        env:
          NAVIGERA_CDP_TRACE: ${{ runner.temp }}/cdp-trace.jsonl
          NAVIGERA_REQUIRE_BROWSER: "1"
        run: |
          set -o pipefail
          if ! cargo test --locked --features http --no-fail-fast 2>&1 | tee /tmp/test.log; then
            # Surface the failure through the checks API, not just the log.
            sed -n '/^---- /,/^test result/p' /tmp/test.log | grep -v -E '^ +[0-9]+: |^ +at ' | tail -c 30000 > /tmp/test-tail.log || true
            python3 bench/ladder/annotate.py /tmp/test-tail.log "cargo test failure"
            exit 1
          fi

      - name: CDP protocol check (every command/param/enum the tests sent vs this Chrome's /json/protocol)
        run: |
          set -o pipefail
          google-chrome --version
          bash tools/protocol_dump.sh google-chrome "$RUNNER_TEMP/protocol.json"
          rc=0
          python3 tools/cdp_check.py --protocol "$RUNNER_TEMP/protocol.json" \
            --trace "$RUNNER_TEMP/cdp-trace.jsonl" --label "$(google-chrome --version)" \
            --markdown "$RUNNER_TEMP/cdp-check.md" || rc=$?
          python3 bench/ladder/annotate.py "$RUNNER_TEMP/cdp-check.md" "cdp check"
          exit $rc

      - name: Clippy
        run: cargo clippy --locked --features http --all-targets -- -D warnings

      - name: Harness syntax check
        run: |
          python3 -m py_compile bench/ladder/*.py bench/ladder/contenders/*.py bench/gate/*.py \
            bench/site/server.py tests/fixtures/*.py tools/*.py bench/agent-eval/*.py bench/ide-eval/*.py packaging/*.py
          node --check bench/ladder/contenders/contender_playwright.mjs
          node --check bench/ladder/contenders/contender_puppeteer.mjs
          for f in tests/fixtures/electron-app/*.js; do node --check "$f"; done

      # Files only Glama's build uses (glama.json, packaging/glama/) never go
      # into a release: the crate's file list is checked here; npm, PyPI,
      # Homebrew, Scoop and the archives carry the binary alone.
      - name: Glama files stay out of the packages
        run: |
          sh -n packaging/glama/build.sh
          if cargo package --list --locked --allow-dirty | grep -iE '(^|/)(glama\.json|packaging/glama/)'; then
            echo "::error::a Glama-only file is in the crate's package list (Cargo.toml include)"
            exit 1
          fi

  # Electron apps (`start --electron`): the fixture app on each OS, with the
  # Electron the npm package installs. Linux has no display, so xvfb-run.
  electron:
    name: electron (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable
      - name: Electron for the fixture app
        working-directory: tests/fixtures/electron-app
        run: |
          npm install --no-audit --no-fund --no-package-lock
          # The binary comes from the package's install script, which npm
          # no longer runs for dependencies by default.
          node node_modules/electron/install.js
          node -e "console.log('electron', require('electron/package.json').version, require('electron'))"
      - name: Tests (Electron e2e)
        env:
          NAVIGERA_REQUIRE_ELECTRON: "1"
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/test.log"
          run=""
          if [ "$RUNNER_OS" = "Linux" ]; then run="xvfb-run -a"; fi
          # To a file, not through `| tee`: a process a failed test leaves behind
          # would hold the pipe open, and the step would wait out its time limit.
          rc=0
          $run cargo test --locked --test electron -- --nocapture > "$log" 2>&1 || rc=$?
          cat "$log"
          if [ "$rc" -ne 0 ]; then
            sed -n '/^---- /,/^test result/p' "$log" | grep -v -E '^ +[0-9]+: |^ +at ' | tail -c 30000 > "$RUNNER_TEMP/test-tail.log" || true
            py=python3; command -v python3 > /dev/null || py=python
            $py bench/ladder/annotate.py "$RUNNER_TEMP/test-tail.log" "electron test failure (${{ matrix.os }})"
            exit 1
          fi

  # Known-vulnerable dependencies (RustSec advisory database).
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  # The oldest Rust that builds navigera (rust-version in Cargo.toml).
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: cargo check --locked --all-targets

  # The static Linux binaries a release ships (musl, with mimalloc's C
  # code), built on every change rather than first at release time. On
  # x86_64 the binary also reads a page with the runner's Chrome.
  musl:
    name: musl (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - uses: ./.github/actions/apt-install
        with:
          packages: musl-tools
      - run: cargo build --release --locked --bin navigera --target ${{ matrix.target }}
      - name: Binary size against the last release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          bin="target/$TARGET/release/navigera"
          now=$(stat -c %s "$bin")
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "navigera-$TARGET.tar.gz" --dir "$RUNNER_TEMP/last"
          last=$(tar -xzOf "$RUNNER_TEMP/last/navigera-$TARGET.tar.gz" --wildcards '*navigera' | wc -c)
          echo "size $TARGET: $now B now, $last B in $tag, $((now - last)) B more"
          echo "::notice title=size $TARGET::$now B now, $last B in $tag, $((now - last)) B more"
      - name: Smoke test
        run: |
          bin=target/${{ matrix.target }}/release/navigera
          file "$bin" | tee /dev/stderr | grep -q 'static'
          "$bin" --version
          if [ "${{ matrix.target }}" = x86_64-unknown-linux-musl ]; then
            printf '%s\n' '{"id":1,"op":"goto","url":"data:text/html,<h1>Static</h1><button>Go</button>"}' \
              '{"id":2,"op":"ax","format":"text"}' '{"id":3,"op":"quit"}' | "$bin" serve | tee out.jsonl
            grep -q 'heading \\"Static\\"' out.jsonl && grep -q 'button \\"Go\\"' out.jsonl
          fi

  # Windows: the same unit + e2e tests on the runner's Chrome, through the
  # Windows code paths (WebSocket CDP, loopback-TCP sessions with a token,
  # kill-on-close job object).
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable
          components: clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Tests (unit + browser e2e on the runner's Chrome, CDP traced)
        # A build from nothing takes most of this; a run from the cache, 5.
        timeout-minutes: 25
        env:
          NAVIGERA_CDP_TRACE: ${{ runner.temp }}/cdp-trace.jsonl
          NAVIGERA_REQUIRE_BROWSER: "1"
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/test.log"
          # To a file, not through `| tee`: a process a failed test leaves behind
          # would hold the pipe open, and the step would wait out its time limit.
          rc=0
          cargo test --locked --features http --no-fail-fast > "$log" 2>&1 || rc=$?
          cat "$log"
          if [ "$rc" -ne 0 ]; then
            sed -n '/^---- /,/^test result/p' "$log" | grep -v -E '^ +[0-9]+: |^ +at ' | tail -c 30000 > "$RUNNER_TEMP/test-tail.log" || true
            python bench/ladder/annotate.py "$RUNNER_TEMP/test-tail.log" "cargo test failure (windows)"
            exit 1
          fi
          # Which tests ran (a skipped e2e test would show up as missing).
          grep -E '^     Running|^test .* \.\.\. |^test result' "$log" | grep -v '^test cdp::\|^test protocol::' > "$RUNNER_TEMP/test-summary.log" || true
          python bench/ladder/annotate.py "$RUNNER_TEMP/test-summary.log" "cargo test summary (windows)"
      - name: Clippy
        if: success() || failure()
        run: cargo clippy --locked --features http --all-targets -- -D warnings

  # The same tests on macOS (bitti's macOS job reaches navigera only through
  # the library). The fixture sites bind without a host-name lookup, which
  # costs about 35 s per start on these runners (tests/fixtures/local_server.py).
  macos:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable
          components: clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Tests (unit + browser e2e on the runner's Chrome, CDP traced)
        # A build from nothing takes most of this; a run from the cache, 5.
        timeout-minutes: 30
        env:
          NAVIGERA_CDP_TRACE: ${{ runner.temp }}/cdp-trace.jsonl
          NAVIGERA_REQUIRE_BROWSER: "1"
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/test.log"
          # To a file, not through `| tee`: a process a failed test leaves behind
          # would hold the pipe open, and the step would wait out its time limit.
          rc=0
          cargo test --locked --features http --no-fail-fast > "$log" 2>&1 || rc=$?
          cat "$log"
          if [ "$rc" -ne 0 ]; then
            sed -n '/^---- /,/^test result/p' "$log" | grep -v -E '^ +[0-9]+: |^ +at ' | tail -c 30000 > "$RUNNER_TEMP/test-tail.log" || true
            python bench/ladder/annotate.py "$RUNNER_TEMP/test-tail.log" "cargo test failure (macos)"
            exit 1
          fi
          # Which tests ran (a skipped e2e test would show up as missing).
          grep -E '^     Running|^test .* \.\.\. |^test result' "$log" | grep -v '^test cdp::\|^test protocol::' > "$RUNNER_TEMP/test-summary.log" || true
          python bench/ladder/annotate.py "$RUNNER_TEMP/test-summary.log" "cargo test summary (macos)"
      - name: Clippy
        if: success() || failure()
        run: cargo clippy --locked --features http --all-targets -- -D warnings

  # The install path agents actually take: `curl install.sh | sh` (a
  # release binary, or the cargo fallback while there is no release), and
  # `irm install.ps1 | iex` on Windows.
  # `install-browser` against the real Chrome for Testing, and a session on
  # what it installed (the session log names the executable it launched).
  install-browser:
    name: install-browser (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      NAVIGERA_TIMINGS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable
          cache: false
      - run: cargo build --locked --bin navigera
      - name: install, again (already there), then a session on it
        shell: bash
        run: |
          export NAVIGERA_BROWSERS="$RUNNER_TEMP/browsers"
          # Ubuntu's runner image sets $CHROME_BIN to its Chrome, and an
          # explicit $CHROME_BIN wins over what install-browser installed.
          unset CHROME_BIN NAVIGERA_CHROMIUM
          nv=target/debug/navigera
          $nv install-browser --where
          $nv install-browser | tee "$RUNNER_TEMP/first.json"
          grep -q '"ok":true' "$RUNNER_TEMP/first.json"
          $nv install-browser | grep -q '"already":true'
          $nv -s ib start | tee "$RUNNER_TEMP/start.json"
          $nv -s ib goto "data:text/html,<title>ok</title>" | grep -q '"title":"ok"'
          $nv -s ib quit
          log=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['result']['log'])" "$RUNNER_TEMP/start.json")
          grep "executable" "$log"
          grep -q "executable .*chrome-headless-shell" "$log"

  install:
    name: install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # A source build (no release yet) builds the commit under test.
      NAVIGERA_GIT_REV: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable
      - name: install.sh as an agent runs it
        if: runner.os != 'Windows'
        run: |
          rustup default stable
          cd "$RUNNER_TEMP"
          NAVIGERA_INSTALL_DIR="$RUNNER_TEMP/bin" sh "$GITHUB_WORKSPACE/install.sh" 2>&1 | tail -5 | tee /tmp/install.log
          "$RUNNER_TEMP/bin/navigera" --version || { python3 "$GITHUB_WORKSPACE/bench/ladder/annotate.py" /tmp/install.log "install.sh failure"; exit 1; }
          "$RUNNER_TEMP/bin/navigera" skill | head -3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"
      - name: install.ps1 as an agent runs it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup default stable
          Set-Location $env:RUNNER_TEMP
          $env:NAVIGERA_INSTALL_DIR = "$env:RUNNER_TEMP\bin"
          $log = "$env:RUNNER_TEMP\install.log"
          # The repo's script (the published URL serves master's copy).
          try {
            Get-Content -Raw "$env:GITHUB_WORKSPACE\install.ps1" | Invoke-Expression *>&1 |
              ForEach-Object { "$_" } | Tee-Object -FilePath $log
          } catch {
            "THROWN: $($_ | Out-String)" | Tee-Object -FilePath $log -Append
          }
          $exe = "$env:RUNNER_TEMP\bin\navigera.exe"
          if (-not (Test-Path $exe)) {
            Get-Content $log -Tail 40 | Set-Content "$env:RUNNER_TEMP\install-tail.log"
            python "$env:GITHUB_WORKSPACE\bench\ladder\annotate.py" "$env:RUNNER_TEMP\install-tail.log" "install.ps1 failure"
            exit 1
          }
          & $exe --version
          & $exe skill | Select-Object -First 3
          # Installed for this session too: the bare name resolves.
          (Get-Command navigera).Source

  # Chrome for Testing builds: the current Stable and three milestones back,
  # chrome-headless-shell, and Beta (non-blocking early warning).
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: pick
        run: python3 tools/cft_matrix.py >> "$GITHUB_OUTPUT"

  compat:
    needs: browsers
    name: chrome ${{ matrix.browser.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: ${{ matrix.browser.channel == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJson(needs.browsers.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable
      - name: Download ${{ matrix.browser.kind }} ${{ matrix.browser.version }}
        run: |
          curl -sSfL --retry 3 -o /tmp/browser.zip "${{ matrix.browser.url }}"
          unzip -q /tmp/browser.zip -d /tmp/browser
          echo "CHROME_BIN=/tmp/browser/${{ matrix.browser.exe }}" >> "$GITHUB_ENV"
      - name: e2e tests (CDP traced)
        timeout-minutes: 15
        env:
          NAVIGERA_CDP_TRACE: ${{ runner.temp }}/cdp-trace.jsonl
          NAVIGERA_REQUIRE_BROWSER: "1"
          NAVIGERA_CHROME_LOG: ${{ runner.temp }}/chrome.log
        run: |
          set -o pipefail
          "$CHROME_BIN" --version || true
          if ! cargo test --locked --features http --no-fail-fast 2>&1 | tee /tmp/test.log; then
            sed -n '/^---- /,/^test result/p' /tmp/test.log | grep -v -E '^ +[0-9]+: |^ +at ' | tail -c 30000 > /tmp/test-tail.log || true
            python3 bench/ladder/annotate.py /tmp/test-tail.log "cargo test failure (${{ matrix.browser.label }})"
            { grep -E -m 20 'FATAL|Check failed|Received signal|DCHECK|NOTREACHED|crash' "$NAVIGERA_CHROME_LOG"; echo '---'; \
              grep -v -E 'dbus|Fontconfig|^#[0-9]|^ +[a-z0-9]+: |^$' "$NAVIGERA_CHROME_LOG" | tail -c 4000; } > /tmp/chrome-tail.log || true
            python3 bench/ladder/annotate.py /tmp/chrome-tail.log "chrome stderr (${{ matrix.browser.label }})"
            exit 1
          fi
      - name: CDP protocol check
        run: |
          if ! bash tools/protocol_dump.sh "$CHROME_BIN" "$RUNNER_TEMP/protocol.json" > /tmp/dump.log 2>&1; then
            python3 bench/ladder/annotate.py /tmp/dump.log "protocol dump failure (${{ matrix.browser.label }})"
            exit 1
          fi
          rc=0
          python3 tools/cdp_check.py --protocol "$RUNNER_TEMP/protocol.json" \
            --trace "$RUNNER_TEMP/cdp-trace.jsonl" --label "${{ matrix.browser.label }} (${{ matrix.browser.version }})" \
            --markdown "$RUNNER_TEMP/cdp-check.md" || rc=$?
          python3 bench/ladder/annotate.py "$RUNNER_TEMP/cdp-check.md" "cdp check ${{ matrix.browser.label }}"
          exit $rc
