name: vendor

# Publishes `cargo vendor` output to the git ref `refs/cache/vendor` (not a
# branch, so it never shows up in the branch list). Machines that can reach
# github.com over git but not crates.io can build and run the browser e2e
# tests offline from it:
#
#   git fetch origin refs/cache/vendor:refs/cache/vendor
#   git worktree add ../nv-vendor refs/cache/vendor   # or: git archive | tar x
#   # then point cargo at it, see CONTRIBUTING.md "Offline builds"

on:
  push:
    paths: [Cargo.lock, .github/workflows/vendor.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vendor
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: cargo vendor (main crate + Rust ladder contenders)
        run: |
          set -euo pipefail
          mkdir -p /tmp/cache
          args=()
          for m in bench/ladder/contenders/chromiumoxide/Cargo.toml bench/ladder/contenders/chromey/Cargo.toml; do
            [ -f "$m" ] && [ -f "$(dirname "$m")/Cargo.lock" ] && args+=(--sync "$m")
          done
          cargo vendor --locked "${args[@]}" /tmp/cache/vendor > /tmp/cache/cargo-config.toml
          sed -i 's#directory = ".*"#directory = "vendor"#' /tmp/cache/cargo-config.toml
          cp Cargo.lock /tmp/cache/Cargo.lock
          du -sh /tmp/cache/vendor
      - name: Push to refs/cache/vendor
        run: |
          set -euo pipefail
          cd /tmp/cache
          git init -q
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com \
            commit -q -m "cargo vendor for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/cache/vendor
          echo "::notice title=vendor::refs/cache/vendor updated for ${GITHUB_SHA}"
