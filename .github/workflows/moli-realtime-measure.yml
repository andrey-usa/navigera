# Measurement-only (NOT for landing): Moli --realtime vs --layout on CI.
# Builds navigera from this branch (--realtime) and from BASE_REF
# (--layout only), measures the Moli server's idle CPU and goto/click/text/
# ax/eval on the #27 example and a ~4,500-node page for each, and uploads
# the numbers. Dispatch manually; the owner decides on the numbers.
name: moli realtime measure
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "layout-only base ref (no --realtime)"
        default: "6183881"
        required: true
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable
          cache-on-failure: false
      - name: Moli binary
        uses: ./.github/actions/moli
      - name: Build both variants and measure
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail
          # The measure script lives only on this branch: keep a copy
          # before checking the base out (it has no such file).
          cp bench/moli-realtime-measure.py /tmp/measure.py
          cargo build --release --locked
          cp target/release/navigera /tmp/nv-realtime
          git checkout "$BASE_REF"
          cargo build --release --locked
          cp target/release/navigera /tmp/nv-layout
          python3 /tmp/measure.py --binary /tmp/nv-realtime --moli-bin "$MOLI_BIN" --label realtime --out /tmp/results-realtime.json
          python3 /tmp/measure.py --binary /tmp/nv-layout --moli-bin "$MOLI_BIN" --label layout --out /tmp/results-layout.json
      - name: Combine into a table
        run: |
          python3 - <<'EOF'
          import json, statistics
          rt = json.load(open('/tmp/results-realtime.json'))
          lo = json.load(open('/tmp/results-layout.json'))
          lines = []
          lines.append('# Moli --realtime vs --layout (CI, ubuntu-24.04)')
          lines.append('')
          lines.append(f"navigera realtime: {rt['navigera']}; layout: {lo['navigera']}")
          lines.append(f"Moli: {rt['moli']} (both variants)")
          lines.append(f"layout probe: realtime `{rt['layout_probe']}`; layout `{lo['layout_probe']}`")
          lines.append(f"layout_refresh phases in session log: realtime {rt['layout_refresh_phases']}; layout {lo['layout_refresh_phases']}")
          lines.append(f"Moli RSS kB: realtime {rt.get('moli_rss_kb')}; layout {lo.get('moli_rss_kb')}")
          lines.append('')
          lines.append('## Idle CPU, Moli process, % of one core over 10 s (3 windows)')
          lines.append('')
          lines.append('| variant | w1 | w2 | w3 | median |')
          lines.append('|---|---|---|---|---|')
          for tag, r in (('realtime', rt), ('layout', lo)):
              w = r['idle_cpu_pct_10s']
              lines.append(f"| {tag} | {w[0]} | {w[1]} | {w[2]} | {statistics.median(w)} |")
          lines.append('')
          lines.append('## Op times, median of 5 reps, ms')
          lines.append('')
          lines.append('| page | op | realtime | layout | realtime - layout |')
          lines.append('|---|---|---|---|---|')
          for page in ('page_a', 'page_b'):
              nodes = rt['ops_ms_median'][page].get('nodes', '')
              lines.append(f"| {page} ({nodes} nodes) | | | | |")
              for op in ('goto', 'click', 'text', 'ax', 'eval_rect'):
                  a = rt['ops_ms_median'][page][op]
                  b = lo['ops_ms_median'][page][op]
                  d = round(a - b, 2) if a is not None and b is not None else None
                  lines.append(f"| {page} | {op} | {a} | {b} | {d} |")
          lines.append('')
          for tag, r in (('realtime', rt), ('layout', lo)):
              if r['errors']:
                  lines.append(f"errors ({tag}): {r['errors']}")
          open('results.md', 'w').write('\n'.join(lines) + '\n')
          EOF
          cat results.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: moli-realtime-measure
          path: |
            /tmp/results-realtime.json
            /tmp/results-layout.json
            results.md
