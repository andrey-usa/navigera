name: Deploy docs to GitHub Pages

# Every page is generated from its source (README.md, docs/, the skill and
# `navigera --help`) by docs-site/build.py, so any push to master can change
# the site.
on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: stable
      - name: Build navigera (for `--help`)
        run: cargo build --release --locked
      - name: Write the pages from their sources
        run: python3 docs-site/build.py target/release/navigera
      - name: Install mdBook
        run: |
          mkdir -p /tmp/mdbook
          curl -sL https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz | tar xz -C /tmp/mdbook
          echo /tmp/mdbook >> "$GITHUB_PATH"
      - name: Build the book
        working-directory: docs-site
        run: mdbook build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/book
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
