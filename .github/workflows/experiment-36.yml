name: experiment-36

# What the static musl build (as released) costs a call on GitHub's runner,
# and where (bench/probe/libc_probe.py). Run 4: the off-CPU view of
# mimalloc's click tail. Three builds (musl + mimalloc as released, musl +
# musl's malloc, glibc + glibc's), all with frame pointers; the click with
# a 0.3 s and a 0.02 s rest before it; then per build the scheduler's view
# of the clicks (perf sched record of the machine) and the session
# server's switch-out stacks. Numbers as notices, raw output as the
# artifact.

on:
  push:
    branches: [experiment-36]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Symbols for perf; stripping does not change the code.
      CARGO_PROFILE_RELEASE_STRIP: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Chrome and agent-browser
        run: |
          CHROME_BIN=$(which google-chrome)
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install -g agent-browser@latest
          echo "::notice::$(agent-browser --version) · $("$CHROME_BIN" --version) · $(nproc) cpus · $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2) · kernel $(uname -r)"

      - uses: ./.github/actions/apt-install
        with:
          packages: musl-tools strace

      - name: perf
        run: |
          sudo apt-get install -y -qq --no-install-recommends "linux-tools-$(uname -r)" || sudo apt-get install -y -qq --no-install-recommends linux-tools-azure
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0 kernel.yama.ptrace_scope=0
          perf --version

      - name: Build the three navigera builds
        env:
          RUSTFLAGS: "-C force-frame-pointers=yes"
          CFLAGS: "-fno-omit-frame-pointer"
        run: |
          rustup target add x86_64-unknown-linux-musl
          b="$RUNNER_TEMP/builds"
          one() { # name, target dir part, cargo args...
            name=$1; dir=$2; shift 2
            cargo build --release --locked --bin navigera "$@"
            mkdir -p "$b/$name" && cp "target/$dir/release/navigera" "$b/$name/navigera"
          }
          one musl-mi x86_64-unknown-linux-musl --target x86_64-unknown-linux-musl
          one musl-sys x86_64-unknown-linux-musl --target x86_64-unknown-linux-musl --features exp-sysalloc
          one glibc-sys .
          ls -l "$b"/*/navigera
          echo "NAVIGERA_BUILDS=musl-mi=$b/musl-mi/navigera,musl-sys=$b/musl-sys/navigera,glibc-sys=$b/glibc-sys/navigera" >> "$GITHUB_ENV"
          echo "::notice::THP $(cat /sys/kernel/mm/transparent_hugepage/enabled) · defrag $(cat /sys/kernel/mm/transparent_hugepage/defrag) · overcommit $(cat /proc/sys/vm/overcommit_memory)"

      - name: Fixtures
        run: |
          python3 bench/ladder/gen_fixtures.py
          python3 - <<'PY'
          rows = "".join(f'<tr><td>Item {i}</td><td><button>Edit {i}</button></td><td><a href="#r{i}">View {i}</a></td></tr>' for i in range(2000))
          open("bench/ladder/fixtures/big.html", "w").write(
              "<!doctype html><title>rows</title><header><nav aria-label=Main><a href=/>Home</a> <a href=/o>Orders</a></nav>"
              "<h1>Invoices</h1><form role=search><label>Search <input name=q></label> <button>Go</button></form></header>"
              f"<main><table><tbody>{rows}</tbody></table></main>")
          PY
          (cd bench/ladder/fixtures && nohup python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          mkdir -p "$RUNNER_TEMP/out"

      - name: The click by the rest before it (0.3 s, 0.02 s), interleaved
        env:
          ROUNDS: "6"
          REST_REPS: "5"
        run: python3 bench/probe/libc_probe.py rest http://127.0.0.1:8765 "$RUNNER_TEMP/out"

      - name: Off-CPU view, musl + mimalloc
        run: python3 bench/probe/libc_probe.py sched musl-mi http://127.0.0.1:8765 "$RUNNER_TEMP/out"

      - name: Off-CPU view, musl + malloc
        run: python3 bench/probe/libc_probe.py sched musl-sys http://127.0.0.1:8765 "$RUNNER_TEMP/out"

      - name: Off-CPU view, glibc
        run: python3 bench/probe/libc_probe.py sched glibc-sys http://127.0.0.1:8765 "$RUNNER_TEMP/out"

      - name: Off-CPU view, musl + mimalloc again (order and drift)
        run: |
          mkdir -p "$RUNNER_TEMP/out/again"
          python3 bench/probe/libc_probe.py sched musl-mi http://127.0.0.1:8765 "$RUNNER_TEMP/out/again"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: probe
          path: ${{ runner.temp }}/out
