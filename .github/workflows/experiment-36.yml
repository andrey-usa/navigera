name: experiment-36

# What the static musl build (as released) costs a call on GitHub's runner,
# and where (bench/probe/libc_probe.py). Run 6: runs 4-5 found that a
# runner daemon (provjobd) spends ~1.1 ms of CPU on every process that
# reserves mimalloc's 1 GiB arena, and takes Chrome's CPU during a click.
# Here: what provjobd reacts to (mimalloc's reserve from 0 to 512 MiB;
# a plain 1 GiB mapping in another program), and the click, `eval`,
# `--version` and the 2,000-row `ax` per arm, with provjobd's CPU per call
# in the same windows. Builds as released (no frame pointers), plus musl +
# mimalloc with a 32 MiB reserve set in code before the first allocation.
# Numbers as notices, raw output as the artifact.

on:
  push:
    branches: [experiment-36]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Symbols for perf; stripping does not change the code.
      CARGO_PROFILE_RELEASE_STRIP: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Chrome and agent-browser
        run: |
          CHROME_BIN=$(which google-chrome)
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          npm install -g agent-browser@latest
          echo "::notice::$(agent-browser --version) · $("$CHROME_BIN" --version) · $(nproc) cpus · $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2) · kernel $(uname -r)"

      - uses: ./.github/actions/apt-install
        with:
          packages: musl-tools strace

      - name: perf
        run: |
          sudo apt-get install -y -qq --no-install-recommends "linux-tools-$(uname -r)" || sudo apt-get install -y -qq --no-install-recommends linux-tools-azure
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0 kernel.yama.ptrace_scope=0
          perf --version

      - name: Build the navigera builds
        run: |
          rustup target add x86_64-unknown-linux-musl
          b="$RUNNER_TEMP/builds"
          one() { # name, target dir part, cargo args...
            name=$1; dir=$2; shift 2
            cargo build --release --locked --bin navigera "$@"
            mkdir -p "$b/$name" && cp "target/$dir/release/navigera" "$b/$name/navigera"
          }
          one musl-mi x86_64-unknown-linux-musl --target x86_64-unknown-linux-musl
          one musl-sys x86_64-unknown-linux-musl --target x86_64-unknown-linux-musl --features exp-sysalloc
          one glibc-sys .
          NAVIGERA_EXP_ARENA_KIB=32768 one musl-mi-code32m x86_64-unknown-linux-musl --target x86_64-unknown-linux-musl --features exp-arena-reserve
          ls -l "$b"/*/navigera
          echo "NAVIGERA_BUILDS=musl-mi=$b/musl-mi/navigera,musl-sys=$b/musl-sys/navigera,glibc-sys=$b/glibc-sys/navigera,musl-mi-code32m=$b/musl-mi-code32m/navigera" >> "$GITHUB_ENV"
          echo "NAVIGERA_ENV_ARMS=musl-mi:r0:MIMALLOC_ARENA_RESERVE=0;musl-mi:r32m:MIMALLOC_ARENA_RESERVE=32MiB;musl-mi:r256m:MIMALLOC_ARENA_RESERVE=256MiB" >> "$GITHUB_ENV"
          for x in musl-mi musl-mi-code32m; do
            echo "::notice title=$x mappings over 16 MiB at --version::$(strace -f -e trace=mmap -e signal=none "$b/$x/navigera" --version 2>&1 >/dev/null | awk -F, '$2+0 >= 16777216 {print $2, $3}' | tr '\n' ';')"
          done
          echo "::notice::THP $(cat /sys/kernel/mm/transparent_hugepage/enabled) · defrag $(cat /sys/kernel/mm/transparent_hugepage/defrag) · overcommit $(cat /proc/sys/vm/overcommit_memory)"

      - name: Fixtures
        run: |
          python3 bench/ladder/gen_fixtures.py
          python3 - <<'PY'
          rows = "".join(f'<tr><td>Item {i}</td><td><button>Edit {i}</button></td><td><a href="#r{i}">View {i}</a></td></tr>' for i in range(2000))
          open("bench/ladder/fixtures/big.html", "w").write(
              "<!doctype html><title>rows</title><header><nav aria-label=Main><a href=/>Home</a> <a href=/o>Orders</a></nav>"
              "<h1>Invoices</h1><form role=search><label>Search <input name=q></label> <button>Go</button></form></header>"
              f"<main><table><tbody>{rows}</tbody></table></main>")
          PY
          (cd bench/ladder/fixtures && nohup python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          mkdir -p "$RUNNER_TEMP/out"

      - name: What the runner's provjobd reacts to
        run: |
          pids=$(pgrep -f provjob || true)
          echo "pids: $pids"
          for p in $pids; do
            echo "== $p"; sudo cat /proc/$p/cmdline | tr '\0' ' '; echo
            sudo ls -l /proc/$p/exe || true; cat /proc/$p/cgroup || true
          done
          cpu() { # provjobd's CPU ticks so far (utime + stime of each process)
            t=0; for p in $pids; do set -- $(sudo cat /proc/$p/stat 2>/dev/null | sed 's/.*) //'); t=$((t + ${12:-0} + ${13:-0})); done; echo $t; }
          one() { # label, command...: provjobd ticks over 200 runs of the command
            l=$1; shift; a=$(cpu); s=$(date +%s%N)
            for i in $(seq 200); do "$@" >/dev/null 2>&1; done
            e=$(date +%s%N); b=$(cpu)
            echo "::notice title=provjobd ticks per 200 calls (CLK_TCK $(getconf CLK_TCK))::$l: $((b - a)) ticks, calls $(( (e - s) / 200000 )) us each"
          }
          IFS=, read -ra kv <<< "$NAVIGERA_BUILDS"
          for x in "${kv[@]}"; do one "${x%%=*} --version" "${x#*=}" --version; done
          mi="${kv[0]#*=}"
          for r in 0 32MiB 128MiB 256MiB 512MiB; do one "musl-mi --version, MIMALLOC_ARENA_RESERVE=$r" env MIMALLOC_ARENA_RESERVE=$r "$mi" --version; done
          # Another program: does a plain mapping of that size do it?
          # (size, prot: 0 = PROT_NONE, 3 = PROT_READ | PROT_WRITE)
          map='import mmap, sys; mmap.mmap(-1, int(sys.argv[1]), flags=mmap.MAP_PRIVATE | mmap.MAP_ANONYMOUS | mmap.MAP_NORESERVE, prot=int(sys.argv[2]))'
          one "python3 -c pass" python3 -c pass
          one "python3, 1 GiB PROT_NONE NORESERVE" python3 -c "$map" $((1 << 30)) 0
          one "python3, 1 GiB PROT_READ|WRITE NORESERVE (untouched)" python3 -c "$map" $((1 << 30)) 3
          one "python3, 32 MiB PROT_NONE NORESERVE" python3 -c "$map" $((32 << 20)) 0
          one "/bin/true" /bin/true

      - name: Click, eval, --version and the 2,000-row ax per arm, with provjobd's CPU per call
        env:
          ROUNDS: "8"
          REPS: "15"
        run: python3 bench/probe/libc_probe.py time http://127.0.0.1:8765 "$RUNNER_TEMP/out"

      - name: Off-CPU view, musl + mimalloc with the 32 MiB reserve in code
        run: python3 bench/probe/libc_probe.py sched musl-mi-code32m http://127.0.0.1:8765 "$RUNNER_TEMP/out"

      - name: Off-CPU view, musl + mimalloc as released
        run: python3 bench/probe/libc_probe.py sched musl-mi http://127.0.0.1:8765 "$RUNNER_TEMP/out"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: probe
          path: ${{ runner.temp }}/out
