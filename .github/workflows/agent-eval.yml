name: agent-eval

# A real, generic agent (Gemini CLI, headless, free-tier API key) does
# realistic tasks on the local Acme Supply site with each browser tool:
# navigera vs agent-browser vs playwright-cli. One job per tool, in
# parallel; a report job merges them. See bench/agent-eval/run.py.
#
# Keys are secrets of the `main` environment. Gemini's free quota is per
# Google Cloud project, so each tool job reads its own slot and falls back
# to GEMINI_API_KEY when that slot is empty:
#   navigera   -> GEMINI_API_KEY
#   agent-browser  -> GEMINI_API_KEY_2
#   playwright-cli -> GEMINI_API_KEY_3
# Windows legs use the next slot (navigera -> _2, agent-browser -> _3,
# playwright-cli -> GEMINI_API_KEY). Without any key only the scripted
# baseline runs.
#
# `navigera-lightpanda` and `navigera-shell` run navigera on Lightpanda
# (NAVIGERA_ENGINE=lightpanda) and on chrome-headless-shell ($CHROME_BIN);
# `+jev` adds the decider to either.
#
# `navigera+jev` is navigera with TypeSafe's Jev deciding (`find`, `--find`,
# `check`), next to plain `navigera` as the Gemini-only baseline; it needs
# TYPESAFE_API_KEY in the main environment, held by a local relay
# (bench/decide/relay.py) that the agent's shell never sees. `decisions: true`
# adds a job asking Jev and Gemini the same element choices and yes/no
# questions with known answers (bench/decide/compare.py).
#
# `agent: openai` drives the same eval from an OpenAI-compatible endpoint
# instead of Gemini CLI (run.py --agent openai): the model is any id the
# endpoint serves (e.g. DeepSeek V4.1 Flash via SiliconFlow, whose key is
# SILICONFLOW_API_KEY in the main environment; one key for every tool job).
# The decisions baseline follows the model id the same way: `gemini-*`
# ids use GEMINI_API_KEY, other ids the OpenAI-compatible endpoint.
#
# `os: windows` (or `both`) runs the same jobs on windows-latest: the agent's
# shell is PowerShell there, and rows read `<tool> (windows)`.
#
# Results: annotations `agent eval <mode> N/M` and `agent eval json <mode>`
# on the report job; per-tool tables on each tool job.

on:
  workflow_dispatch:
    inputs:
      tools:
        description: "comma-separated: navigera,navigera-lightpanda,navigera-shell,navigera+jev,navigera-lightpanda+jev,navigera-shell+jev,navigera+jev-told,agent-browser,agent-browser-lightpanda,playwright-cli (none: no agent runs)"
        default: "navigera,navigera-lightpanda,agent-browser,playwright-cli"
      lightpanda:
        description: "Lightpanda release tag for the navigera-lightpanda tools (e.g. 1.0.1, nightly)"
        default: "1.0.1"
      tasks:
        description: "comma-separated task ids (lookup,purchase,account,docs,support,purchase-live) or all (local tasks)"
        default: "all"
      mode:
        description: "skilled (skill preinstalled), onboard (agent installs the tool from its docs), both, or scripted (no model: the scripted baseline only)"
        default: "both"
      agent:
        description: "gemini (Gemini CLI) or openai (OpenAI-compatible endpoint, e.g. DeepSeek via SiliconFlow)"
        default: "gemini"
      model:
        description: "model id for the chosen agent (Gemini free tier: a Flash-Lite model has the largest daily quota)"
        default: "gemini-3.5-flash-lite"
      reps:
        description: "repetitions per tool x task"
        default: "1"
      os:
        description: "linux, windows or both"
        default: "linux"
      decisions:
        description: "also ask Jev and the baseline model the same decisions (bench/decide/compare.py)"
        type: boolean
        default: false
      decide_models:
        description: "model ids for the decisions baseline, comma-separated (gemini-* via Gemini, others via the OpenAI-compatible endpoint)"
        default: "gemini-3.5-flash-lite"
      live:
        description: "decisions: include the public-web cases"
        type: boolean
        default: true
  schedule:
    - cron: "41 9 * * 2"   # after the free quota resets (midnight Pacific)

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          TOOLS: ${{ inputs.tools || 'navigera,navigera-lightpanda,agent-browser,playwright-cli' }}
          OSES: ${{ inputs.os || 'linux' }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          slot = {"navigera": "GEMINI_API_KEY", "navigera-lightpanda": "GEMINI_API_KEY_2", "navigera-shell": "GEMINI_API_KEY_3",
                  "navigera+jev": "GEMINI_API_KEY_2", "navigera-lightpanda+jev": "GEMINI_API_KEY_3",
                  "navigera-shell+jev": "GEMINI_API_KEY", "navigera+jev-told": "GEMINI_API_KEY_3",
                  "agent-browser": "GEMINI_API_KEY_2", "agent-browser-lightpanda": "GEMINI_API_KEY",
                  "playwright-cli": "GEMINI_API_KEY_3"}
          # Windows legs take the next slot over, so `os: both` spreads the
          # load over the keys instead of doubling it on each.
          rotate = {"GEMINI_API_KEY": "GEMINI_API_KEY_2", "GEMINI_API_KEY_2": "GEMINI_API_KEY_3",
                    "GEMINI_API_KEY_3": "GEMINI_API_KEY"}
          runner = {"linux": "ubuntu-latest", "windows": "windows-latest"}
          oses = ["linux", "windows"] if os.environ["OSES"] == "both" else \
                 [o for o in os.environ["OSES"].split(",") if o in runner]
          tools = [t.strip() for t in os.environ["TOOLS"].split(",") if t.strip() in slot]
          print("matrix=" + json.dumps([{"tool": t, "key": slot[t] if o == "linux" else rotate[slot[t]], "os": o, "runner": runner[o]}
                                        for o in oses for t in tools]))
          EOF

  eval:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    name: ${{ matrix.run.tool }} (${{ matrix.run.os }})
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.run.runner }}
    timeout-minutes: 180
    environment: main
    defaults:
      run:
        shell: bash
    env:
      TOOL: ${{ matrix.run.tool }}
      AGENT: ${{ inputs.agent || 'gemini' }}
      MODEL: ${{ inputs.model || 'gemini-3.5-flash-lite' }}
      TASKS: ${{ inputs.tasks || 'all' }}
      MODE: ${{ inputs.mode || 'both' }}
      REPS: ${{ inputs.reps || '1' }}
      HAS_KEY: ${{ ((matrix.run.key == 'GEMINI_API_KEY_2' && secrets.GEMINI_API_KEY_2) || (matrix.run.key == 'GEMINI_API_KEY_3' && secrets.GEMINI_API_KEY_3) || secrets.GEMINI_API_KEY) != '' }}
      KEY_SLOT: ${{ ((matrix.run.key == 'GEMINI_API_KEY_2' && secrets.GEMINI_API_KEY_2 != '') || (matrix.run.key == 'GEMINI_API_KEY_3' && secrets.GEMINI_API_KEY_3 != '')) && matrix.run.key || 'GEMINI_API_KEY' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/agent-setup
      - name: Lightpanda binary (navigera-lightpanda tools)
        if: contains(matrix.run.tool, 'lightpanda')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.lightpanda || '1.0.1' }}
        run: |
          mkdir -p "$RUNNER_TEMP/lightpanda-bin"
          gh release download "$RELEASE" --repo lightpanda-io/browser --pattern 'lightpanda-x86_64-linux' \
            --dir "$RUNNER_TEMP/lightpanda-bin"
          chmod +x "$RUNNER_TEMP/lightpanda-bin"/lightpanda*
          echo "LIGHTPANDA_BIN=$RUNNER_TEMP/lightpanda-bin/lightpanda-x86_64-linux" >> "$GITHUB_ENV"
          echo "::notice title=agent eval lightpanda::$("$RUNNER_TEMP/lightpanda-bin/lightpanda-x86_64-linux" version)"
      - name: chrome-headless-shell (navigera-shell tools)
        if: contains(matrix.run.tool, 'shell')
        run: |
          url=$(python3 tools/cft_matrix.py --no-beta | sed -n 's/^matrix=//p' \
            | python3 -c 'import json,sys; print(next(e["url"] for e in json.load(sys.stdin) if e["kind"] == "chrome-headless-shell"))')
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/chs.zip" "$url"
          unzip -q "$RUNNER_TEMP/chs.zip" -d "$RUNNER_TEMP/chs"
          bin="$RUNNER_TEMP/chs/chrome-headless-shell-linux64/chrome-headless-shell"
          echo "CHROME_BIN=$bin" >> "$GITHUB_ENV"
          echo "::notice title=agent eval chrome::$("$bin" --version)"
      - name: Scripted baseline (site + checks + harness, no model)
        if: matrix.run.tool == 'navigera' || matrix.run.tool == 'navigera-lightpanda' || matrix.run.tool == 'navigera-shell'
        run: |
          rc=0
          python bench/agent-eval/run.py --agent scripted --reps "$REPS" --out out/scripted --require-pass || rc=$?
          python bench/ladder/annotate.py out/scripted/table-skilled.md "agent eval scripted (${{ matrix.run.os }})"
          if [ $rc -ne 0 ]; then
            python bench/agent-eval/annotate_runs.py out/scripted/summary-skilled.json "agent eval scripted json (${{ matrix.run.os }})"
          fi
          exit $rc
      - name: Key
        run: |
          if [ "$AGENT" = openai ] && [ -z "$SILICONFLOW_API_KEY" ]; then
            echo "::notice title=agent eval::no SILICONFLOW_API_KEY in the main environment; only the scripted baseline ran."
            echo "HAS_KEY=false" >> "$GITHUB_ENV"
          elif [ "$HAS_KEY" != true ]; then
            echo "::notice title=agent eval::no Gemini key in the main environment; only the scripted baseline ran."
          else
            echo "::notice title=agent eval key::$TOOL (${{ matrix.run.os }}) used $KEY_SLOT"
          fi
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      - name: Model smoke test
        id: smoke
        # Model steps still run when the scripted baseline failed (its own
        # annotation says why; the job stays red), but not after a failed
        # smoke test.
        if: "!cancelled() && env.HAS_KEY == 'true' && env.MODE != 'scripted'"
        env:
          GEMINI_API_KEY: ${{ ((matrix.run.key == 'GEMINI_API_KEY_2' && secrets.GEMINI_API_KEY_2) || (matrix.run.key == 'GEMINI_API_KEY_3' && secrets.GEMINI_API_KEY_3) || secrets.GEMINI_API_KEY) }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          log="$RUNNER_TEMP/smoke.txt"
          if ! python bench/agent-eval/run.py --smoke --agent "$AGENT" --run-timeout 300 --model "$MODEL" --gemini "$GEMINI_BIN" \
               --out out/smoke > "$log" 2>&1; then
            tail -c 3000 "$log" > "$RUNNER_TEMP/smoke-tail.txt"
            python bench/ladder/annotate.py "$RUNNER_TEMP/smoke-tail.txt" "model smoke failure ($TOOL, ${{ matrix.run.os }}, $KEY_SLOT)"
            exit 1
          fi
          cat "$log"
      - name: Decider relay (TypeSafe Jev)
        if: "!cancelled() && contains(matrix.run.tool, '+jev') && env.HAS_KEY == 'true' && env.MODE != 'scripted' && steps.smoke.outcome == 'success'"
        uses: ./.github/actions/jev-relay
        with:
          key: ${{ secrets.TYPESAFE_API_KEY }}
      - name: Onboarding (the agent installs the tool from its own docs)
        if: "!cancelled() && env.HAS_KEY == 'true' && (env.MODE == 'onboard' || env.MODE == 'both') && steps.smoke.outcome == 'success'"
        env:
          GEMINI_API_KEY: ${{ ((matrix.run.key == 'GEMINI_API_KEY_2' && secrets.GEMINI_API_KEY_2) || (matrix.run.key == 'GEMINI_API_KEY_3' && secrets.GEMINI_API_KEY_3) || secrets.GEMINI_API_KEY) }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          bash bench/agent-eval/logged.sh "agent run log (onboard, $TOOL, ${{ matrix.run.os }})" \
            python bench/agent-eval/run.py --mode onboard --agent "$AGENT" --tools "$TOOL" --model "$MODEL" \
            --gemini "$GEMINI_BIN" --reps 1 --out out/gemini \
            ${DECIDER_URL:+--decider-url "$DECIDER_URL" --decider-log "$DECIDER_LOG"}
      - name: Install the tool (for skilled runs)
        if: "!cancelled() && env.HAS_KEY == 'true' && (env.MODE == 'skilled' || env.MODE == 'both') && !startsWith(env.TOOL, 'navigera') && steps.smoke.outcome == 'success'"
        run: |
          case "$TOOL" in
            agent-browser*) npm install -g agent-browser@0.39.1 ;;
            playwright-cli) npm install -g @playwright/cli@0.1.22 ;;
          esac
          npm ls -g --depth=0
      - name: Skilled runs (tool installed, its own skill in the workspace)
        if: "!cancelled() && env.HAS_KEY == 'true' && (env.MODE == 'skilled' || env.MODE == 'both') && steps.smoke.outcome == 'success'"
        env:
          GEMINI_API_KEY: ${{ ((matrix.run.key == 'GEMINI_API_KEY_2' && secrets.GEMINI_API_KEY_2) || (matrix.run.key == 'GEMINI_API_KEY_3' && secrets.GEMINI_API_KEY_3) || secrets.GEMINI_API_KEY) }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          bash bench/agent-eval/logged.sh "agent run log (skilled, $TOOL, ${{ matrix.run.os }})" \
            python bench/agent-eval/run.py --mode skilled --agent "$AGENT" --tools "$TOOL" --tasks "$TASKS" \
            --model "$MODEL" --gemini "$GEMINI_BIN" --reps "$REPS" --out out/gemini \
            ${DECIDER_URL:+--decider-url "$DECIDER_URL" --decider-log "$DECIDER_LOG"}
      - name: Upload this tool's results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: eval-${{ matrix.run.tool }}-${{ matrix.run.os }}
          path: |
            out/gemini/summary-*.json
            ${{ runner.temp }}/jev.jsonl
          if-no-files-found: ignore

  decisions:
    if: inputs.decisions
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/agent-setup
      - uses: ./.github/actions/jev-relay
        with:
          key: ${{ secrets.TYPESAFE_API_KEY }}
      - name: Jev and the model on the same decisions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          MODELS: ${{ inputs.decide_models }}
          REPS: ${{ inputs.reps }}
          LIVE: ${{ inputs.live && '--live' || '' }}
        run: |
          python bench/decide/compare.py --navigera target/release/navigera \
            --decider-url "$DECIDER_URL" --decider-log "$DECIDER_LOG" \
            --models "$MODELS" --reps "$REPS" $LIVE --out out/decide
      - name: Decisions table
        if: always()
        run: python bench/ladder/annotate.py out/decide/decide-compare.md "decide compare"
      - name: Upload the decisions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: decide-compare
          path: |
            out/decide/
            ${{ runner.temp }}/jev.jsonl
          if-no-files-found: ignore

  report:
    needs: eval
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: eval-*
          path: dl
      - name: Merge the tool jobs
        run: |
          files=$(find dl -name 'summary-*.json' | sort)
          if [ -z "$files" ]; then echo "no model results (no key?)"; exit 0; fi
          python3 bench/agent-eval/run.py --out out --merge $files
      # GitHub keeps at most 10 notices per step: one step per annotation set.
      - name: Onboarding table
        run: python3 bench/ladder/annotate.py out/table-onboard.md "agent eval onboard"
      - name: Skilled table
        run: python3 bench/ladder/annotate.py out/table-skilled.md "agent eval skilled"
      - name: Onboarding runs (json)
        run: python3 bench/agent-eval/annotate_runs.py out/summary-onboard.json "agent eval json onboard"
      - name: Skilled runs (json)
        run: python3 bench/agent-eval/annotate_runs.py out/summary-skilled.json "agent eval json skilled"
      - name: Upload merged results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agent-eval
          path: out/
          if-no-files-found: ignore
