name: release

# Prebuilt binaries for static Linux (musl) x86_64/aarch64, macOS
# arm64/x86_64 and Windows x64, attached to a GitHub release, then the same
# binaries repackaged for crates.io, npm, PyPI, Homebrew and Scoop.
#
# Releasing: Actions -> release -> Run workflow on master with the version
# from Cargo.toml (e.g. 0.4.0). The run checks that the version matches
# Cargo.toml, builds every target, tags v<version> on that commit and creates
# the release. Pushing a v* tag works too. Running it again for a version
# whose tag exists rebuilds that tag, replaces the release's files and
# publishes to any registry that doesn't have that version yet.
#
# Each registry is switched on by a repository variable (Settings -> Secrets
# and variables -> Actions -> Variables), once its trusted publisher exists:
#   PUBLISH_CRATES=true  PUBLISH_NPM=true  PUBLISH_PYPI=true
#   HOMEBREW_TAP=<owner>/homebrew-tap  SCOOP_BUCKET=<owner>/scoop-bucket
#   (the last two push with the secret TAP_TOKEN)
# Switched off, the packages are still built and installed in the
# `packages` job, so a dry run checks them too.

on:
  push:
    tags: ["v*"]
    # Dry run: pushing a `release-test/*` branch builds and packages every
    # target without publishing anything.
    branches: ["release-test/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "version to release, as in Cargo.toml (e.g. 0.4.0); tags this commit v<version>"
        required: true
      publish:
        description: "publish (off = dry run: build and package only)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.p.outputs.tag }}
      ref: ${{ steps.p.outputs.ref }}
      publish: ${{ steps.p.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          fail() { echo "::error title=release::$1"; exit 1; }
          if [ "$EVENT" = workflow_dispatch ]; then
            tag="v${INPUT_VERSION#v}"; publish="$INPUT_PUBLISH"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              ref="refs/tags/$tag"     # rebuild an existing release
            else
              ref="$GITHUB_SHA"
            fi
          elif [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            tag="$GITHUB_REF_NAME"; ref="$GITHUB_REF"; publish=true
          else
            tag=""; ref="$GITHUB_SHA"; publish=false   # release-test/* dry run
          fi
          if [ -n "$tag" ]; then
            have=$(git show "$ref:Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
            [ "v$have" = "$tag" ] || fail "$tag does not match Cargo.toml version $have at $ref; bump Cargo.toml first"
          fi
          {
            echo "tag=$tag"; echo "ref=$ref"; echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=release plan::${tag:-dry run} from $ref (publish=$publish)"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - name: musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Build
        env:
          # Windows: link the C runtime statically, so the .exe runs on a
          # machine without the Visual C++ redistributable.
          RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked --bin navigera --target ${{ matrix.target }}
      - name: Smoke test (native targets)
        if: "!contains(matrix.target, 'x86_64-apple') || runner.arch == 'X64'"
        run: |
          bin=target/${{ matrix.target }}/release/navigera
          "$bin" --version
          "$bin" skill | head -3
      - name: Package
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf dist/navigera-${{ matrix.target }}.tar.gz navigera
          (cd dist && shasum -a 256 navigera-${{ matrix.target }}.tar.gz > navigera-${{ matrix.target }}.tar.gz.sha256)
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = "dist/navigera-${{ matrix.target }}.zip"
          Compress-Archive -Path target/${{ matrix.target }}/release/navigera.exe -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$hash  navigera-${{ matrix.target }}.zip" | Out-File -Encoding ascii -NoNewline "$zip.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          REF: ${{ needs.plan.outputs.ref }}
        run: |
          ls -la dist
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Creates the tag on the planned commit when it doesn't exist yet.
            case "$REF" in refs/*) target="$GITHUB_SHA" ;; *) target="$REF" ;; esac
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --target "$target"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/*
          echo "::notice title=release::$TAG published with $(ls dist | wc -l) files: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

  packages:
    needs: [plan, build]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      # The packaging script comes from this workflow's commit; the version,
      # description, README and license from the release ref (which is an
      # older tag when a release is rebuilt).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: meta
        env:
          REF: ${{ needs.plan.outputs.ref }}
        run: |
          mkdir -p release-ref
          for f in Cargo.toml README.md LICENSE; do git show "$REF:$f" > "release-ref/$f" 2>/dev/null || rm -f "release-ref/$f"; done
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import tomllib
          pkg = tomllib.load(open("release-ref/Cargo.toml", "rb"))["package"]
          print(f"version={pkg['version']}")
          print(f"description={pkg['description']}")
          print(f"keywords={','.join(pkg.get('keywords', []))}")
          EOF
      - name: Build npm packages, wheels, Homebrew formula and Scoop manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DESCRIPTION: ${{ steps.meta.outputs.description }}
          KEYWORDS: ${{ steps.meta.outputs.keywords }}
        run: |
          for kind in npm wheel homebrew scoop; do
            python3 packaging/package.py "$kind" --name navigera --version "$VERSION" --dist dist --out pkg \
              --repo "$GITHUB_REPOSITORY" --description "$DESCRIPTION" --keywords "$KEYWORDS" \
              --readme release-ref/README.md --license-file release-ref/LICENSE
          done
          for dir in pkg/npm/*/; do (cd "$dir" && npm pack --silent); done
      - name: Install and run them
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet pkg/wheels/*manylinux*x86_64*.whl
          /tmp/venv/bin/navigera --version
          /tmp/venv/bin/pip install --quiet twine && /tmp/venv/bin/twine check pkg/wheels/*.whl
          mkdir /tmp/npm-test && cd /tmp/npm-test && npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/pkg/npm/navigera-linux-x64/*.tgz "$GITHUB_WORKSPACE"/pkg/npm/navigera/*.tgz
          npx navigera --version
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: pkg/

  crates:
    needs: [plan, publish, packages]
    if: needs.plan.outputs.publish == 'true' && vars.PUBLISH_CRATES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@v1.0.5
        id: auth
      - env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.packages.outputs.version }}
        run: |
          if curl -sfA "github.com/$GITHUB_REPOSITORY" "https://crates.io/api/v1/crates/navigera/$VERSION" >/dev/null; then
            echo "::notice title=crates.io::navigera $VERSION is already published"
          else
            cargo publish --locked
          fi

  npm:
    needs: [plan, publish, packages]
    if: needs.plan.outputs.publish == 'true' && vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: pkg
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - env:
          VERSION: ${{ needs.packages.outputs.version }}
        run: |
          # Platform packages first: the main package depends on them.
          for dir in $(ls -d pkg/npm/*/ | grep -v '/navigera/$') pkg/npm/navigera/; do
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "::notice title=npm::$name $VERSION is already published"
            else
              (cd "$dir" && npm publish --provenance --access public)
            fi
          done

  pypi:
    needs: [plan, publish, packages]
    if: needs.plan.outputs.publish == 'true' && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: pkg
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pkg/wheels
          skip-existing: true

  taps:
    needs: [plan, publish, packages]
    if: needs.plan.outputs.publish == 'true' && (vars.HOMEBREW_TAP != '' || vars.SCOOP_BUCKET != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: pkg
      - env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          HOMEBREW_TAP: ${{ vars.HOMEBREW_TAP }}
          SCOOP_BUCKET: ${{ vars.SCOOP_BUCKET }}
          VERSION: ${{ needs.packages.outputs.version }}
        run: |
          git config --global user.name "andrey-usa"
          git config --global user.email "62624421+andrey-usa@users.noreply.github.com"
          update() {  # repo, source file, path in repo
            [ -n "$1" ] || return 0
            d="tap-$(basename "$1")"
            git clone -q "https://x-access-token:$GH_TOKEN@github.com/$1.git" "$d"
            mkdir -p "$(dirname "$d/$3")" && cp "$2" "$d/$3"
            cd "$d"
            git add "$3"
            git diff --cached --quiet || { git commit -qm "navigera $VERSION" && git push -q; }
            cd - >/dev/null
          }
          update "$HOMEBREW_TAP" pkg/navigera.rb Formula/navigera.rb
          update "$SCOOP_BUCKET" pkg/navigera.json bucket/navigera.json
