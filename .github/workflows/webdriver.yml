name: webdriver

# The WebDriver engines on the browsers GitHub's runners carry: Firefox over
# WebDriver BiDi (Linux, macOS, Windows), Safari through safaridriver
# (macOS), and chromedriver over classic WebDriver and over BiDi.
# Dispatched with `base` (a release tag), it also times those engines and
# the text search against that release's binary (bench/gate/engines.py):
# the run a CHANGELOG entry cites for their numbers.
on:
  push:
    branches: [master, next]
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: "release tag to time the engines against (empty: no timings)"
        default: ""
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: read

concurrency:
  group: webdriver-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NAVIGERA_OUTPUT: json

jobs:
  engines:
    name: engines (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable
          cache-on-failure: false
      - name: The runner's browsers and drivers
        run: |
          case "$RUNNER_OS" in
            Linux) ff="$(command -v firefox)" ;;
            macOS)
              ff="/Applications/Firefox.app/Contents/MacOS/firefox"
              # Safari's driver works once enabled (it also allows remote automation).
              sudo safaridriver --enable
              echo "NAVIGERA_SAFARI=1" >> "$GITHUB_ENV"
              echo "NAVIGERA_REQUIRE_SAFARI=1" >> "$GITHUB_ENV"
              ;;
            Windows) ff="C:/Program Files/Mozilla Firefox/firefox.exe" ;;
          esac
          # Git Bash on Windows keeps the variable's own case (ChromeWebDriver).
          cd_dir="${CHROMEWEBDRIVER:-${ChromeWebDriver:-}}"
          cd_exe="$cd_dir/chromedriver"
          if [ "$RUNNER_OS" = Windows ]; then cd_exe="$cd_dir/chromedriver.exe"; fi
          echo "NAVIGERA_FIREFOX=$ff" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER=$cd_exe" >> "$GITHUB_ENV"
          "$ff" --version || true
          "$cd_exe" --version || true
          if [ "$RUNNER_OS" = macOS ]; then defaults read /Applications/Safari.app/Contents/Info CFBundleShortVersionString || true; fi
      - name: Engines (each scenario on Firefox, Safari, chromedriver classic and BiDi)
        timeout-minutes: 25
        env:
          NAVIGERA_REQUIRE_FIREFOX: "1"
          NAVIGERA_REQUIRE_CHROMEDRIVER: "1"
          RUST_BACKTRACE: "1"
        run: cargo test --locked --test webdriver -- --nocapture --test-threads 1
      - name: Unit tests of the engines
        run: cargo test --locked --lib "wd::"

  timings:
    name: timings against the last release
    if: github.event_name == 'workflow_dispatch' && inputs.base != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl
          cache-on-failure: false
      - uses: ./.github/actions/apt-install
        with:
          packages: musl-tools
      - name: The candidate (static musl, as a release builds it)
        run: cargo build --locked --release --bin navigera --target x86_64-unknown-linux-musl
      - name: The release before it
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ inputs.base }}
        run: |
          mkdir -p "$RUNNER_TEMP/base"
          gh release download "$BASE" --repo "$GITHUB_REPOSITORY" \
            --pattern navigera-x86_64-unknown-linux-musl.tar.gz --dir "$RUNNER_TEMP/base"
          tar -xzf "$RUNNER_TEMP/base/navigera-x86_64-unknown-linux-musl.tar.gz" -C "$RUNNER_TEMP/base"
          "$RUNNER_TEMP/base/navigera" --version
      - name: Firefox stable and the runner's chromedriver
        run: |
          curl -fsSL --retry 4 --retry-all-errors 'https://download.mozilla.org/?product=firefox-latest-ssl&os=linux64&lang=en-US' -o "$RUNNER_TEMP/firefox.tar.xz"
          mkdir -p "$RUNNER_TEMP/firefox"
          tar -xJf "$RUNNER_TEMP/firefox.tar.xz" -C "$RUNNER_TEMP/firefox" --strip-components=1
          echo "NAVIGERA_FIREFOX=$RUNNER_TEMP/firefox/firefox" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER=$CHROMEWEBDRIVER/chromedriver" >> "$GITHUB_ENV"
          echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/firefox/firefox" --version
          "$CHROMEWEBDRIVER/chromedriver" --version
          google-chrome --version
      - name: Timings (median of 20 each, interleaved)
        env:
          BASE: ${{ inputs.base }}
        run: |
          set -o pipefail
          rc=0
          python3 bench/gate/engines.py --base "$RUNNER_TEMP/base/navigera" \
            --candidate target/x86_64-unknown-linux-musl/release/navigera \
            --runs 10 --summary "$RUNNER_TEMP/engines.md" || rc=$?
          { echo "Base: $BASE, candidate: ${GITHUB_SHA::7}"; echo; cat "$RUNNER_TEMP/engines.md"; } >> "$GITHUB_STEP_SUMMARY"
          python3 bench/ladder/annotate.py "$RUNNER_TEMP/engines.md" "engine timings vs $BASE"
          exit $rc
