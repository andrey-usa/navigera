name: gate

# Timing gate before a release: the candidate (this ref) against the release
# before it, on one runner, with fixed probes (bench/gate/gate.py). Fails when
# the candidate is more than 25% (and 20 ms) slower on any probe. Both are the
# static musl build the releases ship: a glibc candidate against a musl base
# compares two allocators, not two versions.

on:
  # Every push to the work branch is held to the last release, so a
  # slowdown shows at the commit that brought it, not at the next release.
  push:
    branches: [next]
    paths-ignore: ["**.md", "docs/**", "docs-site/**"]
  workflow_dispatch:
    inputs:
      base:
        description: "release tag to compare with (empty: the latest release)"
        default: ""

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The CLI's default output is the compact form for agents; the steps
  # here read the JSON lines.
  NAVIGERA_OUTPUT: json

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable
          target: x86_64-unknown-linux-musl
          cache-on-failure: false
      - uses: ./.github/actions/apt-install
        with:
          packages: musl-tools
      - name: The candidate (static musl, as a release builds it)
        run: |
          cargo build --locked --release --bin navigera --target x86_64-unknown-linux-musl
      - name: The release before it
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ inputs.base }}
        run: |
          tag="${BASE:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
          echo "base: $tag"
          mkdir -p "$RUNNER_TEMP/base"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern navigera-x86_64-unknown-linux-musl.tar.gz --dir "$RUNNER_TEMP/base"
          tar -xzf "$RUNNER_TEMP/base/navigera-x86_64-unknown-linux-musl.tar.gz" -C "$RUNNER_TEMP/base"
          "$RUNNER_TEMP/base/navigera" --version
          echo "BASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Probes (median of 10 each, interleaved)
        run: |
          set -o pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          rc=0
          python3 bench/gate/gate.py --base "$RUNNER_TEMP/base/navigera" --candidate target/x86_64-unknown-linux-musl/release/navigera \
            --runs 5 --summary "$RUNNER_TEMP/gate.md" || rc=$?
          { echo "Base: $BASE_TAG, candidate: ${GITHUB_SHA::7}"; echo; cat "$RUNNER_TEMP/gate.md"; } >> "$GITHUB_STEP_SUMMARY"
          python3 bench/ladder/annotate.py "$RUNNER_TEMP/gate.md" "timing gate vs $BASE_TAG"
          exit $rc
