name: bench

# Browser-driver ladder: navigera (serve) vs Playwright vs Puppeteer
# vs chromiumoxide on one scripted headless-Chrome session + eval/cold micros.
#
# Accounting: wall = best of N; driver CPU = the driver's OWN utime+stime
# (zombie /proc read before reaping — wait4's rusage would also include any
# Chrome the driver reaped); driver RSS = its own VmHWM; chrome CPU / peak
# RSS sampled from /proc (approximate). Correctness gate: identical extracted JSON + counts across
# all contenders, else the run fails.
#
# Manual dispatch, like bench-200m.yml in the gruppera repo.

on:
  workflow_dispatch:
    inputs:
      reps:
        description: 'Session repetitions per contender (best-of-N wall)'
        required: false
        default: '3'
      profile:
        description: "set 'true' for a per-op wall/CPU profile of navigera in ladder.log (diagnostic)"
        required: false
        default: 'false'
      only:
        description: "comma-separated contenders (empty = all), e.g. nv-serve,gorod — fast narrow runs"
        required: false
        default: ''
      scenarios:
        description: "optional stages besides the session gate: eval,cold,realworld,browse,agent,parallel,ops"
        required: false
        default: 'eval,cold,realworld,browse,agent,parallel,ops'
      baseline_ref:
        description: "A/B: also run navigera built from this ref (branch, tag or FULL commit SHA) as nv-baseline; same machine, same run"
        required: false
        default: ''
  schedule:
    # Weekly contender check: latest Playwright, Puppeteer, agent-browser etc.
    # (installed with @latest below) vs this repo's navigera.
    - cron: '0 7 * * 1'

permissions:
  contents: read

env:
  # The CLI's default output is the compact form for agents; the steps
  # here read the JSON lines.
  NAVIGERA_OUTPUT: json

jobs:
  ladder:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      REPS: ${{ inputs.reps || '3' }}
      # build_contender.py's records; ladder.py measures a compiled
      # contender only from the binary its record describes.
      LADDER_BUILDS: ${{ github.workspace }}/bench/ladder/out/builds
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history: the baseline step below checks a base ref out of
          # the local objects, and GitHub does not serve a bare SHA fetch
          # (`git fetch origin <sha>` -> "couldn't find remote ref").
          fetch-depth: 0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            . -> target
            bench/ladder/contenders/chromiumoxide -> target
            bench/ladder/contenders/chromey -> target

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27"
          # The Go contenders build from their committed go.sum (-mod=readonly).
          cache-dependency-path: |
            bench/ladder/contenders/chromedp/go.sum
            bench/ladder/contenders/gorod/go.sum

      - name: Chrome version
        run: |
          CHROME_BIN=$(which google-chrome)
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
          "$CHROME_BIN" --version

      - name: Install Firefox stable (BiDi operations)
        run: |
          curl -fsSL --retry 4 --retry-all-errors 'https://download.mozilla.org/?product=firefox-latest-ssl&os=linux64&lang=en-US' -o /tmp/firefox.tar.xz
          sudo mkdir -p /opt/bench-firefox
          sudo tar -xJf /tmp/firefox.tar.xz -C /opt/bench-firefox --strip-components=1
          echo "NAVIGERA_FIREFOX=/opt/bench-firefox/firefox" >> "$GITHUB_ENV"
          /opt/bench-firefox/firefox --version

      - name: Install Microsoft Edge
        # Optional contender: a flaky vendor download must not kill the
        # ladder; a missing binary shows up under "Skipped" in the table.
        continue-on-error: true
        run: |
          curl -fsSL --retry 4 --retry-all-errors https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/microsoft.gpg > /dev/null
          echo "deb [arch=amd64] https://packages.microsoft.com/repos/edge stable main" | sudo tee /etc/apt/sources.list.d/microsoft-edge.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq microsoft-edge-stable
          EDGE_BIN=$(which microsoft-edge-stable || which microsoft-edge)
          echo "EDGE_BIN=$EDGE_BIN" >> "$GITHUB_ENV"
          "$EDGE_BIN" --version

      - name: Install Brave
        # Optional contender: a flaky vendor download must not kill the
        # ladder; a missing binary shows up under "Skipped" in the table.
        continue-on-error: true
        run: |
          sudo curl -fsSL --retry 4 --retry-all-errors -o /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main" | sudo tee /etc/apt/sources.list.d/brave-browser-release.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq brave-browser
          BRAVE_BIN=$(which brave-browser-stable || which brave-browser)
          echo "BRAVE_BIN=$BRAVE_BIN" >> "$GITHUB_ENV"
          "$BRAVE_BIN" --version

      - name: Install Lightpanda (newest stable release)
        # Optional contender: a flaky vendor download must not kill the
        # ladder; a missing binary shows up under "Skipped" in the table.
        id: lightpanda
        continue-on-error: true
        uses: ./.github/actions/lightpanda
      - name: Lightpanda on PATH
        if: steps.lightpanda.outcome == 'success'
        run: |
          ln -sf "$LIGHTPANDA_BIN" /usr/local/bin/lightpanda
          lightpanda version || true

      - name: Install chrome-headless-shell (nv-shell contender)
        # Chrome for Testing's headless-only build of the same Stable Chrome:
        # no browser UI layer, so it starts faster. Optional.
        continue-on-error: true
        run: |
          url=$(curl -sSfL --retry 3 https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["channels"]["Stable"]; print(next(x["url"] for x in d["downloads"]["chrome-headless-shell"] if x["platform"]=="linux64"))')
          curl -sSfL --retry 3 -o /tmp/shell.zip "$url"
          unzip -q /tmp/shell.zip -d /opt
          SHELL_BIN=/opt/chrome-headless-shell-linux64/chrome-headless-shell
          echo "SHELL_BIN=$SHELL_BIN" >> "$GITHUB_ENV"
          "$SHELL_BIN" --version

      - name: Install agent tools (agent-browser, playwright-cli, Playwright MCP, Chrome DevTools MCP)
        # Optional: a failed install shows up under "Skipped".
        # @latest: the weekly schedule measures against the newest releases.
        continue-on-error: true
        run: |
          npm install -g agent-browser@latest @playwright/cli@latest @playwright/mcp@latest chrome-devtools-mcp@latest
          npm ls -g --depth=0

      - name: Install browser-use CLI (ops stage)
        # Optional: the ops stage drives it via its exec model (one Python
        # block per op against its own throwaway Chrome). A failed install
        # shows up under "Skipped" in the table.
        continue-on-error: true
        run: |
          python3 -m pip install --user -q "browser-use[cli]"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          browser-use --version || true

      - uses: ./.github/actions/apt-install
        with:
          packages: musl-tools
      - name: Build navigera (static musl, as released)
        # The numbers are the released build's: install.sh, npm, pip and
        # Homebrew install this static musl binary (mimalloc, tuned in
        # .cargo/config.toml), so the ladder measures it, not a glibc build.
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --bin navigera --target x86_64-unknown-linux-musl
          echo "NAVIGERA=$PWD/target/x86_64-unknown-linux-musl/release/navigera" >> "$GITHUB_ENV"

      - name: Build baseline navigera (A/B)
        if: inputs.baseline_ref != ''
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
        # Built the same way, from inside its own tree: cargo reads
        # .cargo/config.toml from the working directory, and the baseline's
        # build settings are part of what the A/B compares.
        run: |
          # A bare SHA is not fetchable from GitHub, so take the base from
          # the local objects (the checkout above is full history); a branch
          # or tag name still fetches as before.
          git cat-file -e "$BASELINE_REF" 2>/dev/null || git fetch --depth=1 origin "$BASELINE_REF"
          git worktree add /tmp/nv-baseline "$BASELINE_REF"
          cd /tmp/nv-baseline
          # A released tree: a warning a newer cargo has for it can't be
          # fixed there, so it is not denied there.
          CARGO_BUILD_WARNINGS=warn cargo build --release --bin navigera --target x86_64-unknown-linux-musl \
            --target-dir /tmp/nv-baseline-target
          echo "NAVIGERA_BASELINE=/tmp/nv-baseline-target/x86_64-unknown-linux-musl/release/navigera" >> "$GITHUB_ENV"
          # Its version line can be the release it came after: the docs name
          # the commit too.
          echo "NAVIGERA_BASELINE_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "baseline: $(git rev-parse --short HEAD)"

      # Each compiled contender: the binary is deleted first (the Cargo cache
      # restores contenders/*/target), then built, and the build's exit
      # status, binary hash and library version recorded in $LADDER_BUILDS.
      # A failed build does not stop the run: the ladder reports its cells
      # as "build failed" with no version, and the last step fails the job.
      - name: Build chromiumoxide contender (release)
        run: python3 bench/ladder/build_contender.py chromiumoxide

      - name: Build chromey contender (release)
        run: python3 bench/ladder/build_contender.py chromey

      - name: Build Go contenders
        run: |
          python3 bench/ladder/build_contender.py chromedp
          python3 bench/ladder/build_contender.py gorod

      - name: Install node contenders
        working-directory: bench/ladder
        run: |
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund playwright@latest puppeteer-core@latest webdriverio@latest vibium@latest

      - name: Install Playwright Firefox (patched build, Node and Bun API arms)
        working-directory: bench/ladder
        run: |
          npx playwright install --with-deps firefox
          npx vibium install --engine firefox

      - name: Check ladder harness
        run: |
          python3 bench/ladder/test_firefox_ops.py
          python3 bench/ladder/test_contender_builds.py
          node --check bench/ladder/contenders/firefox_library.mjs

      - name: Generate fixtures
        run: python3 bench/ladder/gen_fixtures.py

      - name: Run ladder
        env:
          LADDER_PROFILE: ${{ inputs.profile == 'true' && '1' || '0' }}
          ONLY: ${{ inputs.only || '' }}
          SCENARIOS: ${{ inputs.scenarios || 'eval,cold,realworld,browse,agent,parallel,ops' }}
        run: |
          set -o pipefail
          export CHROME_BIN
          mkdir -p bench/ladder/out
          python3 bench/ladder/ladder.py --out-dir bench/ladder/out \
            --reps "$REPS" --only "$ONLY" \
            --scenarios "$SCENARIOS" 2>&1 | tee bench/ladder/out/ladder.log

      - name: Table as annotations (readable via the checks API)
        if: always()
        run: python3 bench/ladder/annotate.py bench/ladder/out/table.md

      # Two steps: GitHub keeps 10 notices per step and publish.json needs
      # more than 10 (fetch_publish.py joins `ladder json i/N` across them).
      - name: Results JSON as annotations (publish.json, 1 of 2)
        if: success()
        run: python3 bench/ladder/annotate.py bench/ladder/out/publish.json "ladder json" --step 1/2

      - name: Results JSON as annotations (publish.json, 2 of 2)
        if: success()
        run: python3 bench/ladder/annotate.py bench/ladder/out/publish.json "ladder json" --step 2/2

      - name: Failure log tail as annotations
        if: failure()
        run: |
          tail -c 30000 bench/ladder/out/ladder.log > /tmp/ladder-tail.log || true
          python3 bench/ladder/annotate.py /tmp/ladder-tail.log "ladder log tail"

      - name: Upload results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ladder-results
          path: bench/ladder/out/

      - name: Publish table
        run: |
          {
            echo "## bench — browser-driver ladder ($(date -u +%Y-%m-%d))"
            echo ""
            echo "**CPU:** $(grep 'model name' /proc/cpuinfo | head -1 | cut -d: -f2 | xargs) — $(nproc) vCPU · **RAM:** $(free -g | awk '/Mem:/ {print $2}') GB · **Chrome:** $(google-chrome --version)"
            echo "**Reps:** $REPS (best-of-N wall) · **Cache:** warm (fixtures on 127.0.0.1)"
            echo ""
            cat bench/ladder/out/table.md
          } >> "$GITHUB_STEP_SUMMARY"
          cat bench/ladder/out/table.md

      - name: Contender builds
        # After the table and the results are published: a contender that did
        # not build fails the run, so a missing row is never green.
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os, pathlib, sys
          failed = []
          for p in sorted(pathlib.Path(os.environ["LADDER_BUILDS"]).glob("*.json")):
              r = json.loads(p.read_text())
              if r.get("exit") != 0:
                  why = r.get("error") or f"`{r.get('failed_command')}` exited {r.get('exit')}"
                  failed.append(f"{r['name']}: {why}")
          for line in failed:
              print(f"::error title=contender build failed::{line}")
          sys.exit(1 if failed else 0)
          EOF
