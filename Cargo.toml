[package]
name = "navigera"
version = "0.10.1"
edition = "2021"
default-run = "navigera"
description = "Drive headless Chrome and Electron apps from the shell, one command per step: a native Rust CDP CLI for AI agents (accessibility-tree refs, sessions, tabs, iframes, dialogs) plus a JSON-lines serve mode."
license = "MIT"
repository = "https://github.com/andrey-usa/navigera"
homepage = "https://github.com/andrey-usa/navigera"
documentation = "https://github.com/andrey-usa/navigera/blob/master/docs/navigera.md"
readme = "README.md"
keywords = ["chrome", "cdp", "browser-automation", "headless", "electron"]
categories = ["command-line-utilities", "web-programming", "development-tools::testing"]
rust-version = "1.91"
include = ["/src/**", "/skills/**", "/tests/**", "/bench/site/server.py", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "net", "macros"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
tempfile = "3"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
anyhow = "1"
miniz_oxide = "0.9"
# The `http` feature: requests outside the page (primavera's API tests).
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider", "platform-verifier"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }

[features]
# HTTP outside the page, for a crate that uses navigera as a library;
# navigera's own binary doesn't build it.
http = ["dep:ureq", "dep:rustls"]

# musl's allocator is slow on the many small allocations a large snapshot makes.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
