[package]
name = "navigera"
version = "0.13.0"
edition = "2021"
default-run = "navigera"
description = "Drive headless Chrome and Electron apps from the shell, one command per step: a native Rust CDP CLI for AI agents (accessibility-tree refs, sessions, tabs, iframes, dialogs) plus a JSON-lines serve mode."
license = "MIT"
repository = "https://github.com/andrey-usa/navigera"
documentation = "https://andrey-usa.github.io/navigera/"
readme = "README.md"
keywords = ["chrome", "cdp", "browser-automation", "headless", "electron"]
categories = ["command-line-utilities", "web-programming", "development-tools::testing"]
rust-version = "1.91"
include = ["/src/**", "/skills/**", "/tests/**", "/bench/site/server.py", "/build.rs", "/vendor/axe-core/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "net", "macros"] }
# `__rustls-tls`: a `wss://` DevTools endpoint (a browser in the cloud), over
# the rustls config of `src/tls.rs`; the crate builds no TLS config of its own.
tokio-tungstenite = { version = "0.30", features = ["__rustls-tls"] }
futures-util = "0.3"
tempfile = "3"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
anyhow = "1"
miniz_oxide = "0.9"
# Byte search for the reads of large CDP answers (already in the build through serde_json).
memchr = "2"
# TLS for connections navigera opens itself (`--attach wss://`, and the
# `http` feature's requests): rustls with ring, certificates checked by the
# operating system's verifier.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
# The `http` feature: requests outside the page (bitti's API tests).
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider", "platform-verifier"], optional = true }

[build-dependencies]
# Deflates the vendored axe-core into the binary (see build.rs).
miniz_oxide = "0.9"

[features]
# HTTP outside the page: the `http` command, and the library's
# `navigera::http` (bitti's API tests).
default = ["http"]
http = ["dep:ureq"]

# musl's allocator is slow on the many small allocations a large snapshot makes.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
