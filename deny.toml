# cargo-deny: known advisories, licenses, crate sources. CI runs
# `cargo deny check` (security.yml).

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the check unless it is listed here, with why.
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
