# cargo-deny: known advisories, licenses, crate sources. CI runs
# `cargo deny check` (security.yml).

[graph]
all-features = true
# The platforms releases are built for (and Linux glibc, for development):
# a crate only another platform pulls in (Android's, wasm's) isn't shipped.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
# Every RustSec advisory fails the check unless it is listed here, with why.
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "Zlib", "ISC", "BSD-3-Clause"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
