# The tests read each command's JSON line: the CLI's default output is the
# compact form meant for agents (one test checks that default on its own).
[env]
NAVIGERA_OUTPUT = "json"
# The static Linux builds allocate with mimalloc (src/bin/navigera.rs).
# Its default commits each 1 GiB arena up front on Linux, and transparent
# huge pages then back what the process touches with 2 MiB pages: 18 MB of
# resident memory instead of 6, and a first snapshot of a large page three
# times slower (2,000 rows: 655 ms vs 200 ms median, glibc 193). Committing
# on demand keeps both where glibc's are, whatever the machine's huge-page
# setting.
CFLAGS_x86_64_unknown_linux_musl = "-DMI_DEFAULT_ARENA_EAGER_COMMIT=0"
CFLAGS_aarch64_unknown_linux_musl = "-DMI_DEFAULT_ARENA_EAGER_COMMIT=0"
