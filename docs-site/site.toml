# The docs site: its parts, its pages, and where each page's text comes from.
# docs-site/build.py writes every page from this (python3 docs-site/build.py --help).
# The parts and their order are the same for every tool; the pages in them differ.

name = "navigera"
repo = "andrey-usa/navigera"
branch = "master"
binary = "navigera"
summary = """
navigera is browser automation for AI agents from the shell: one native binary
(Rust, no Node) that drives Chrome over the DevTools Protocol, one command per
step, with pages read as a compact accessibility tree with [ref=N] handles.
"""

[coverage.ignore]
# README sections that point at the site rather than hold text of their own.
"README.md" = ["Benchmarks", "Documentation", "Contributing", "License"]

[[part]]
title = "Start"

[[part.page]]
title = "Install"
path = "start/install.md"
about = "Every way to install navigera, the platforms it runs on, and which browser it uses."
source = [{ file = "README.md", section = "Install" }, { file = "docs/install.md" }]

[[part.page]]
title = "Quick start"
path = "start/quick-start.md"
about = "One session and four commands, from install to a page read."
source = { file = "README.md", section = "Quick start" }

[[part.page]]
title = "A first session"
path = "start/tutorial.md"
about = "A tour of one session: the page tree and its refs, the commands, how to name an element, and what comes back."
source = { file = "docs/tutorial.md" }

[[part]]
title = "Guides"

[[part.page]]
title = "Hand the agent your browser"
path = "guides/your-browser.md"
about = "Give an agent your own signed-in browser, a copy of its profile, or a saved state, and take a step back from it."
source = { file = "docs/guides/your-browser.md" }

[[part.page]]
title = "Drive a browser from a program"
path = "guides/programs.md"
about = "Keep one browser on a pipe with `navigera serve`: one JSON command per line in, one JSON reply per line out."
source = [{ file = "docs/guides/programs.md" }, { file = "docs/navigera.md", section = "Serve protocol (programs)", keep_heading = true }]

[[part.page]]
title = "Let a fast model pick the element"
path = "guides/decider.md"
about = "Hand the two small decisions, which element and did it work, to a fast decision model instead of the agent's LLM."
source = [{ file = "docs/guides/decider.md" }, { file = "docs/navigera.md", section = "Decisions: find and check", keep_heading = true }]

[[part.page]]
title = "Use a page's own tools (WebMCP)"
path = "guides/webmcp.md"
about = "Call the tools a page registers for agents through WebMCP, and see which ones it offers."
source = { file = "docs/navigera.md", section = "WebMCP" }

[[part.page]]
title = "Switch from agent-browser"
path = "guides/from-agent-browser.md"
about = "agent-browser's commands and flags, each with its navigera equivalent."
source = { file = "docs/navigera.md", section = "agent-browser → navigera" }

[[part]]
title = "Concepts"

[[part.page]]
title = "How navigera works"
path = "concepts/how-it-works.md"
about = "The three ways to run navigera, and what it does for you between the commands: waits, settling, tabs, dialogs."
source = [{ file = "docs/navigera.md", preamble = true }, { file = "docs/navigera.md", section = "Behaviour", keep_heading = true }]

[[part.page]]
title = "Supported browsers"
path = "concepts/browsers.md"
about = "Which browsers and engines navigera drives, how CI tests each one, and how a browser is found or installed."
source = [{ file = "README.md", section = "Supported browsers" }, { file = "docs/browsers.md" }, { file = "docs/navigera.md", section = "Browsers and engines", keep_heading = true }]

[[part.page]]
title = "Several models, one browser"
path = "concepts/multi-model.md"
about = "Why a small decision model sits beside the agent's LLM, what it was measured to do, and what comes next."
source = { file = "docs/multi-model.md" }

