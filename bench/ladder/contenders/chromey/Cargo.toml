[package]
name = "ladder-chromey"
version = "0.1.0"
edition = "2021"

# Bench-only contender: the same canonical session as the chromiumoxide
# contender, built on chromey — spider-rs's actively developed successor to
# chromiumoxide (the same API under the library name `chromey` since 3.0;
# SIMD JSON decoding, pipelined frame decode, maintained Chrome launch
# defaults). The source is ../chromiumoxide/src/main.rs with the crate
# renamed.

[[bin]]
name = "ladder-chromey"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chromey = "3"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
